name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which app to deploy
        type: choice
        options: [both, api, web]
        default: both

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect which app changed so a frontend-only commit does not redeploy the API.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/**'
              - 'requirements.txt'
              - '.vercelignore'
              - '.github/workflows/deploy.yml'
            web:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  deploy-api:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      contains(fromJSON('["both","api"]'), inputs.target)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      # Source upload + remote build — mirrors `vercel --prod` run locally.
      - run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://capymedi.vercel.app/api/v1/status

  deploy-web:
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      contains(fromJSON('["both","web"]'), inputs.target)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - name: Pull production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://capymedi-web.vercel.app/ > /dev/null
