name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Runner self-hosted có thể là Windows, nơi shell mặc định là PowerShell.
# Ép bash để các step chạy giống nhau trên mọi OS.
defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    # Ghim nhãn cụ thể: nhãn `self-hosted` trần khớp mọi runner của repo/organization,
    # job có thể rơi vào máy khác OS. `windows` + `x64` là nhãn mặc định của runner này.
    runs-on: [self-hosted, windows, x64]

    steps:
      # Workspace không được tạo lại như máy ảo hosted. Xoá rác trước khi checkout
      # để cache/bytecode của lần chạy trước không làm lệch kết quả test.
      - name: Clean stale workspace artifacts
        run: |
          rm -rf .pytest_cache .ruff_cache node_modules
          find . -path ./.git -prune -o -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Verify runner toolchain
        run: |
          # Step này chạy được nghĩa là bash đã có (defaults.run.shell: bash).
          # Trên Windows, bash đến từ Git for Windows.
          missing=""
          for tool in git curl; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::Self-hosted runner thiếu:$missing. Cài sẵn trên máy rồi chạy lại."
            exit 1
          fi
          # setup-python tải bản 3.11 nếu máy ra được internet; máy bị chặn mạng
          # ngoài thì phải cài sẵn Python, nên chỉ cảnh báo chứ không fail ở đây.
          command -v python >/dev/null 2>&1 ||
            echo "::warning::Không thấy Python có sẵn — setup-python sẽ phải tải về."

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check backend/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          INTERNAL_AUTH_SECRET: test-internal-secret-for-ci-testing-only
          JWT_SECRET: test-jwt-secret-for-ci-testing-only
